<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌾 Fantasy Farm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#c8a060;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:1rem;font-family:"Segoe UI",sans-serif}
#wrapper{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
#rg{display:flex;flex-direction:column;align-items:center}
#hud{display:flex;gap:.8rem;margin-bottom:8px;background:rgba(15,8,0,.65);border-radius:12px;padding:8px 14px;flex-wrap:wrap;justify-content:center;border:1px solid rgba(255,200,80,.35);backdrop-filter:blur(4px)}
.hud-item{text-align:center}
.hud-label{font-size:9px;color:#f0c870;letter-spacing:1px;text-transform:uppercase}
.hud-val{font-size:16px;font-weight:700;color:#fff5d0}
#canvas{border:2px solid rgba(255,210,120,.5);border-radius:12px;display:block;cursor:pointer;box-shadow:0 8px 40px rgba(0,0,0,.55)}
#toolbar{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;justify-content:center;max-width:520px}
.tool-btn{padding:5px 10px;border:1px solid rgba(200,150,50,.5);border-radius:8px;background:rgba(15,8,0,.55);color:#f5e0a0;font-size:11px;cursor:pointer;transition:all .12s;white-space:nowrap}
.tool-btn:hover{background:rgba(100,70,0,.65)}
.tool-btn.active{background:rgba(180,120,20,.75);border-color:#f0c840;font-weight:700;color:#fff5c0}
#msg{font-size:11px;color:#f0d080;margin-top:5px;height:14px;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#season-bar{display:flex;gap:4px;margin-bottom:6px}
.season-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.15)}
.season-dot.done{background:#78b030}.season-dot.current{background:#EF9F27}
/* Editor */
#editor{background:rgba(15,8,0,.65);border:1px solid rgba(255,180,60,.4);border-radius:12px;padding:12px;width:186px;flex-shrink:0;color:#f0d090;backdrop-filter:blur(4px)}
#editor h2{font-size:12px;color:#f5d060;margin-bottom:10px;text-align:center;border-bottom:1px solid rgba(255,180,60,.3);padding-bottom:5px;letter-spacing:.5px}
.ed-section{margin-bottom:10px}
.ed-section-title{font-size:9px;color:#c8a040;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.ed-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ed-label{font-size:10px;color:#e0c080}
.ed-row input[type=color]{width:30px;height:20px;border:1px solid rgba(200,150,50,.5);border-radius:3px;padding:1px;cursor:pointer;background:none}
#preview-wrap{display:flex;justify-content:center;margin-bottom:8px}
#preview{border:1px solid rgba(200,150,50,.4);border-radius:6px}
#btn-reset{width:100%;padding:5px;border:1px solid rgba(200,150,50,.4);border-radius:6px;background:rgba(0,0,0,.3);color:#c8a040;font-size:10px;cursor:pointer}
#btn-reset:hover{background:rgba(100,70,0,.4)}
/* Animal panel */
#animal-panel{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.animal-btn{padding:4px 9px;border:1px solid rgba(200,150,50,.4);border-radius:7px;background:rgba(15,8,0,.5);color:#f5e0a0;font-size:11px;cursor:pointer;transition:background .12s}
.animal-btn:hover{background:rgba(100,70,0,.6)}
.animal-btn.active{background:rgba(150,90,10,.75);border-color:#f0c840;font-weight:700}
</style>
</head>
<body>
<div id="wrapper">
  <div id="rg">
    <div id="hud">
      <div class="hud-item"><div class="hud-label">💰 เงิน</div><div class="hud-val" id="h-money">800</div></div>
      <div class="hud-item"><div class="hud-label">📅 วัน</div><div class="hud-val" id="h-day">1</div></div>
      <div class="hud-item"><div class="hud-label">🌾 ข้าว</div><div class="hud-val" id="h-rice">0</div></div>
      <div class="hud-item"><div class="hud-label">🌽 ผัก</div><div class="hud-val" id="h-veg">0</div></div>
      <div class="hud-item"><div class="hud-label">🧃 ผลไม้</div><div class="hud-val" id="h-fruit">0</div></div>
      <div class="hud-item"><div class="hud-label">⭐ คะแนน</div><div class="hud-val" id="h-score">0</div></div>
    </div>
    <div id="season-bar"></div>
    <canvas id="canvas" width="520" height="420"></canvas>
    <div id="toolbar">
      <button class="tool-btn active" id="t-plow"    onclick="setTool('plow')">⛏ ไถ</button>
      <button class="tool-btn" id="t-rice"    onclick="setTool('rice')">🌾 ข้าว</button>
      <button class="tool-btn" id="t-corn"    onclick="setTool('corn')">🌽 ข้าวโพด</button>
      <button class="tool-btn" id="t-tomato"  onclick="setTool('tomato')">🍅 มะเขือ</button>
      <button class="tool-btn" id="t-melon"   onclick="setTool('melon')">🍈 แตงโม</button>
      <button class="tool-btn" id="t-tree"    onclick="setTool('tree')">🌳 ต้นไม้</button>
      <button class="tool-btn" id="t-pen"     onclick="setTool('pen')">🏠 สร้างคอก</button>
      <button class="tool-btn" id="t-remove"  onclick="setTool('remove')">🗑 ลบคอก</button>
      <button class="tool-btn" id="t-water"   onclick="setTool('water')">💧 รดน้ำ</button>
      <button class="tool-btn" id="t-harvest" onclick="setTool('harvest')">🌾 เก็บ</button>
      <button class="tool-btn" id="t-sell"    onclick="sellAll()">💰 ขาย</button>
      <button class="tool-btn" id="t-next"    onclick="nextDay()">☀️ วันถัดไป</button>
    </div>
    <div id="animal-panel">
      <span style="font-size:10px;color:#f0c870;align-self:center">① สร้างคอก 2×2 → ② เลือกสัตว์ → ③ คลิกคอก:</span>
      <button class="animal-btn" id="a-chicken" onclick="selectAnimalToBuy('chicken')">🐔 ไก่ (150฿)</button>
      <button class="animal-btn" id="a-pig"     onclick="selectAnimalToBuy('pig')">🐷 หมู (300฿)</button>
      <button class="animal-btn" id="a-cow"     onclick="selectAnimalToBuy('cow')">🐄 วัว (500฿)</button>
      <button class="animal-btn" id="a-duck"    onclick="selectAnimalToBuy('duck')">🦆 เป็ด (120฿)</button>
    </div>
    <div id="msg">ยินดีต้อนรับสู่ Fantasy Farm! เลือกเครื่องมือแล้วคลิกที่ดิน</div>
  </div>

  <div id="editor">
    <h2>🎨 ปรับแต่ง</h2>
    <div id="preview-wrap"><canvas id="preview" width="80" height="80"></canvas></div>
    <div class="ed-section">
      <div class="ed-section-title">👤 ชาวนา</div>
      <div class="ed-row"><span class="ed-label">ผิว</span><input type="color" id="c-skin" value="#F5C97A" oninput="applyColors()"></div>
      <div class="ed-row"><span class="ed-label">เสื้อ</span><input type="color" id="c-shirt" value="#D45C2A" oninput="applyColors()"></div>
      <div class="ed-row"><span class="ed-label">กางเกง</span><input type="color" id="c-pants" value="#3B2800" oninput="applyColors()"></div>
      <div class="ed-row"><span class="ed-label">หมวก</span><input type="color" id="c-hat" value="#5a7a20" oninput="applyColors()"></div>
    </div>
    <div class="ed-section">
      <div class="ed-section-title">🌾 ดิน</div>
      <div class="ed-row"><span class="ed-label">พื้นว่าง</span><input type="color" id="c-empty" value="#c8b87a" oninput="applyColors()"></div>
      <div class="ed-row"><span class="ed-label">ดินไถ</span><input type="color" id="c-plowed" value="#7a4a20" oninput="applyColors()"></div>
      <div class="ed-row"><span class="ed-label">รดน้ำ</span><input type="color" id="c-watered" value="#3a6a80" oninput="applyColors()"></div>
    </div>
    <button id="btn-reset" onclick="resetColors()">↺ รีเซ็ต</button>
  </div>
</div>

function applyColors(){for(const k in DEFAULTS){const el=document.getElementById("c-"+k);if(el)C[k]=el.value;}}
function resetColors(){C={...DEFAULTS};for(const k in DEFAULTS){const el=document.getElementById("c-"+k);if(el)el.value=DEFAULTS[k];}}

// ── ISO math ─────────────────────────────────────────
const W=520,H=420,COLS=9,ROWS=8;
const TW=52,TH=26,DEPTH=12;
const ORIGIN_X=W/2, ORIGIN_Y=72;
function iso(c,r){return{sx:ORIGIN_X+(c-r)*(TW/2), sy:ORIGIN_Y+(c+r)*(TH/2)};}
function uniso(mx,my){
  const dx=mx-ORIGIN_X,dy=my-ORIGIN_Y;
  const c=(dx/(TW/2)+dy/(TH/2))/2, r=(dy/(TH/2)-dx/(TW/2))/2;
  const ci=Math.floor(c),ri=Math.floor(r);
  return(ci>=0&&ci<COLS&&ri>=0&&ri<ROWS)?{c:ci,r:ri}:null;
}

// ── Farmer ────────────────────────────────────────────
const farmer={gc:.5,gr:.5,tc:.5,tr:.5,moving:false,walkT:0,facingRight:true,speed:.045,currentTool:"plow",working:false,workT:0,workDur:40,workAction:null,pendingAction:null};
let animId=null,windT=0,tickT=0;

function moveFarmerTo(c,r,onArrive){
  farmer.tc=c+.5;farmer.tr=r+.5;
  farmer.moving=true;farmer.facingRight=farmer.tc>=farmer.gc;
  farmer.pendingAction=onArrive;
  if(!animId)animLoop();
}
function animLoop(){updateFarmer();windT++;tickT++;draw();
  if(farmer.moving||farmer.working)animId=requestAnimationFrame(animLoop);else animId=null;}
function updateFarmer(){
  if(farmer.working){farmer.workT++;
    if(farmer.workT>=farmer.workDur){farmer.working=false;farmer.workT=0;if(farmer.workAction){farmer.workAction();farmer.workAction=null;}}return;}
  if(!farmer.moving)return;
  const dc=farmer.tc-farmer.gc,dr=farmer.tr-farmer.gr,dist=Math.sqrt(dc*dc+dr*dr);
  if(dist<farmer.speed){farmer.gc=farmer.tc;farmer.gr=farmer.tr;farmer.moving=false;farmer.walkT=0;
    if(farmer.pendingAction){farmer.working=true;farmer.workT=0;farmer.workAction=farmer.pendingAction;farmer.pendingAction=null;if(!animId)animLoop();}
  }else{farmer.gc+=(dc/dist)*farmer.speed;farmer.gr+=(dr/dist)*farmer.speed;farmer.facingRight=dc>0;farmer.walkT+=0.2;}
}

// ── Helpers ───────────────────────────────────────────
function darken(h,a){let n=parseInt(h.replace("#",""),16);return"#"+[((n>>16)&255),(n>>8)&255,n&255].map(v=>Math.max(0,v-a).toString(16).padStart(2,"0")).join("");}
function lighten(h,a){let n=parseInt(h.replace("#",""),16);return"#"+[((n>>16)&255),(n>>8)&255,n&255].map(v=>Math.min(255,v+a).toString(16).padStart(2,"0")).join("");}
function hex2rgb(h){let n=parseInt(h.replace("#",""),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function lerp(a,b,t){return a+(b-a)*t;}
function lerpColor(c1,c2,t){const a=hex2rgb(c1),b=hex2rgb(c2);return"rgb("+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(",")+")";}

// ── Tile drawing ──────────────────────────────────────
function drawTile(sx,sy,top,left,right,h){
  h=h||DEPTH;
  const hw=TW/2,hh=TH/2;
  // Left face
  ctx.beginPath();ctx.moveTo(sx-hw,sy);ctx.lineTo(sx,sy+hh);ctx.lineTo(sx,sy+hh+h);ctx.lineTo(sx-hw,sy+h);ctx.closePath();
  ctx.fillStyle=left||darken(top,55);ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.12)";ctx.lineWidth=.5;ctx.stroke();
  // Right face
  ctx.beginPath();ctx.moveTo(sx+hw,sy);ctx.lineTo(sx,sy+hh);ctx.lineTo(sx,sy+hh+h);ctx.lineTo(sx+hw,sy+h);ctx.closePath();
  ctx.fillStyle=right||darken(top,35);ctx.fill();ctx.stroke();
  // Top face
  ctx.beginPath();ctx.moveTo(sx,sy-hh);ctx.lineTo(sx+hw,sy);ctx.lineTo(sx,sy+hh);ctx.lineTo(sx-hw,sy);ctx.closePath();
  ctx.fillStyle=top;ctx.fill();ctx.stroke();
}

function drawTileGlow(sx,sy,col,alpha){
  const hw=TW/2,hh=TH/2;
  ctx.beginPath();ctx.moveTo(sx,sy-hh);ctx.lineTo(sx+hw,sy);ctx.lineTo(sx,sy+hh);ctx.lineTo(sx-hw,sy);ctx.closePath();
  ctx.fillStyle=col||(alpha?"rgba(255,220,80,"+alpha+")":"rgba(255,220,80,.25)");ctx.fill();
}

// ── Plant drawing ─────────────────────────────────────
function drawPlant(sx,sy,cell,seed){
  if(!cell.crop||cell.state<STATE.PLANTED)return;
  const cr=CROPS[cell.crop];
  const pct=Math.min(1,cell.growPct||0);
  const sway=Math.sin(windT*.04+seed)*(1.5+pct*2);
  const mature=cell.state===STATE.READY;
  const col=mature?cr.matureColor:lerpColor("#88cc44",cr.color,pct);

  ctx.save();ctx.translate(sx,sy-DEPTH);

  if(cell.crop==="rice"){
    // Rice: multiple thin curved stalks
    const cnt=mature?5:Math.ceil(pct*5)+1;
    const h=8+pct*16;
    for(let i=0;i<cnt;i++){
      const ox=(i-cnt/2)*3.5;
      const sw=sway*(0.8+i*.12);
      ctx.strokeStyle=col;ctx.lineWidth=1.2+(pct*.3);ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(ox,0);ctx.quadraticCurveTo(ox+sw*.4,-(h*.5),ox+sw,-(h));ctx.stroke();
      if(mature){
        // grain head droops
        ctx.strokeStyle=cr.matureColor;ctx.lineWidth=1;
        for(let g=0;g<4;g++){
          const ga=(g/4)*1.2-.3+sw*.04;
          const gl=6;
          ctx.beginPath();ctx.moveTo(ox+sw,-(h));ctx.lineTo(ox+sw+Math.sin(ga)*gl,-(h)+Math.cos(ga)*gl*.6);ctx.stroke();
          ctx.fillStyle=cr.matureColor;
          ctx.beginPath();ctx.ellipse(ox+sw+Math.sin(ga)*gl,-(h)+Math.cos(ga)*gl*.6,1.8,2.8,ga,0,Math.PI*2);ctx.fill();
        }
      }
    }
  } else if(cell.crop==="corn"){
    const h=10+pct*22;const sw=sway*.9;
    // Main stalk
    ctx.strokeStyle=col;ctx.lineWidth=2+pct;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(sw*.5,-(h*.6),sw,-(h));ctx.stroke();
    // Leaves
    if(pct>.3){
      [[.35,1],[.6,-1],[.8,1]].forEach(([lh,side])=>{
        if(pct>lh-.1){
          const lx=lerp(0,sw,lh),ly=-h*lh;
          ctx.strokeStyle=lerpColor("#66aa22",col,.7);ctx.lineWidth=1.2;
          ctx.beginPath();ctx.moveTo(lx,ly);ctx.quadraticCurveTo(lx+side*10,ly-6,lx+side*14,ly-4);ctx.stroke();
        }
      });
    }
    // Cob
    if(mature){
      ctx.fillStyle="#e89020";ctx.strokeStyle="#c07010";ctx.lineWidth=1;
      const cx=sw*.75,cy=-(h*.75);
      ctx.beginPath();ctx.ellipse(cx,cy,3.5,7,-.3,0,Math.PI*2);ctx.fill();ctx.stroke();
      // kernel dots
      ctx.fillStyle="#f0c030";
      for(let r=0;r<3;r++)for(let cc=0;cc<3;cc++){
        ctx.beginPath();ctx.arc(cx-2.5+cc*2.5,cy-4+r*3,1,0,Math.PI*2);ctx.fill();
      }
    }
  } else if(cell.crop==="tomato"){
    const h=8+pct*14;const sw=sway*.7;
    // Bushy plant
    const branches=Math.ceil(pct*4)+1;
    for(let b=0;b<branches;b++){
      const bx=(b-branches/2)*4;const bh=h*.7+b*.4;const bsw=sw+b*.4;
      ctx.strokeStyle=col;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(bx,0);ctx.quadraticCurveTo(bx+bsw*.4,-(bh*.5),bx+bsw,-(bh));ctx.stroke();
    }
    // Tomatoes
    if(mature){
      ctx.shadowBlur=3;ctx.shadowColor="#ff2020";
      [[0,-h+1,5],[sw*.5,-(h*.6),4],[sw*.8,-(h*.4),3.5]].forEach(([tx,ty,tr])=>{
        const gr=ctx.createRadialGradient(tx-.5,ty-.5,0,tx,ty,tr);
        gr.addColorStop(0,"#ff5050");gr.addColorStop(.6,"#dd1010");gr.addColorStop(1,"#990000");
        ctx.fillStyle=gr;ctx.beginPath();ctx.arc(tx,ty,tr,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="#228822";ctx.font="5px sans-serif";ctx.fillText("✿",tx-3,ty-tr+1);
      });
      ctx.shadowBlur=0;
    }
  } else if(cell.crop==="melon"){
    const h=5+pct*10;const sw=sway*.6;
    // Vine tendrils
    for(let v=0;v<3;v++){
      const vx=(v-1)*7;const vsw=sw+v*.5;
      ctx.strokeStyle=col;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(vx+vsw*.3,-(h*.4),vx+vsw,-(h*(0.5+v*.15)));ctx.stroke();
    }
    // Leaves
    if(pct>.4){
      ctx.fillStyle=lerpColor("#44aa22",col,.5)+"88";
      [-8,0,8].forEach(lx=>{
        ctx.beginPath();ctx.ellipse(lx+sway*.4,-h*.5,5,4,.3,0,Math.PI*2);ctx.fill();
      });
    }
    // Melons
    if(mature){
      ctx.shadowBlur=4;ctx.shadowColor="#10aa10";
      [[sw,-h,8],[-3,-h*.5,5],[sw*.3,-h*.7,4]].forEach(([mx,my,mr])=>{
        const gr=ctx.createRadialGradient(mx-.5,my-.5,0,mx,my,mr);
        gr.addColorStop(0,"#44cc44");gr.addColorStop(.5,"#208820");gr.addColorStop(1,"#104410");
        ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(mx,my,mr,mr*.75,0,0,Math.PI*2);ctx.fill();
        // Stripes
        ctx.strokeStyle="rgba(0,80,0,.5)";ctx.lineWidth=.8;
        for(let s=0;s<4;s++){ctx.beginPath();ctx.arc(mx,my,mr*.7,(-0.6+s*.4)-.5,(-0.6+s*.4)+.5);ctx.stroke();}
      });
      ctx.shadowBlur=0;
    }
  } else if(cell.crop==="tree"){
    const h=14+pct*28;const sw=sway*.5;
    // Trunk
    ctx.strokeStyle="#8B5E3C";ctx.lineWidth=3+pct*2;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(sw*.3,-(h*.5),sw*.2,-(h*.65));ctx.stroke();
    // Bark texture
    ctx.strokeStyle="#6B3E1C";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-1,-h*.2);ctx.quadraticCurveTo(sw*.1,-h*.45,sw*.15,-h*.6);ctx.stroke();
    // Canopy layers
    const layers=mature?4:Math.ceil(pct*4)+1;
    for(let ly=0;ly<layers;ly++){
      const lp=ly/Math.max(layers-1,1);
      const lx=sw*.2+sw*.3*Math.sin(lp*Math.PI);
      const ly2=-(h*.65)-(lp*h*.3);
      const lr=9+pct*8-lp*4;
      const gr=ctx.createRadialGradient(lx-lr*.3,ly2-lr*.3,0,lx,ly2,lr);
      gr.addColorStop(0,lighten(col,30));
      gr.addColorStop(.5,col);
      gr.addColorStop(1,darken(col,30));
      ctx.fillStyle=gr;
      ctx.beginPath();ctx.arc(lx,ly2,lr,0,Math.PI*2);ctx.fill();
    }
    // Fruits if mature
    if(mature){
      ctx.shadowBlur=3;ctx.shadowColor="#ff8800";
      const fruitPositions=[[sw*.1,-(h*.9),3.5],[sw*.4,-(h*.8),3],[sw*.05,-(h*.75),2.8],[sw*.35,-(h*.95),2.5]];
      fruitPositions.forEach(([fx,fy,fr])=>{
        const gr=ctx.createRadialGradient(fx-.5,fy-.5,0,fx,fy,fr);
        gr.addColorStop(0,"#ffaa30");gr.addColorStop(.6,"#ff6600");gr.addColorStop(1,"#cc3300");
        ctx.fillStyle=gr;ctx.beginPath();ctx.arc(fx,fy,fr,0,Math.PI*2);ctx.fill();
      });
      ctx.shadowBlur=0;
    }
  }
  ctx.restore();
}

// ── Animal drawing ────────────────────────────────────
function drawAnimal(a){
  const {sx,sy}=iso(a.gx,a.gy);
  const ay=sy-DEPTH;
  const wt=a.walkT;
  const bob=Math.abs(Math.sin(wt))*.8;
  const dir=a.dir||1;
  ctx.save();ctx.translate(Math.round(sx),Math.round(ay-bob));ctx.scale(dir,1);

  if(a.type==="chicken"){
    // Shadow
    ctx.fillStyle="rgba(0,0,0,.15)";ctx.beginPath();ctx.ellipse(0,9,5,2,0,0,Math.PI*2);ctx.fill();
    // Body
    const bg=ctx.createRadialGradient(-1,-1,0,0,0,8);bg.addColorStop(0,"#fffde8");bg.addColorStop(.7,"#f5e8c0");bg.addColorStop(1,"#d4c090");
    ctx.fillStyle=bg;ctx.beginPath();ctx.ellipse(0,2,6,5,.2,0,Math.PI*2);ctx.fill();
    // Wing
    ctx.fillStyle="#e8d8a0";ctx.beginPath();ctx.ellipse(-1,2,4,3,-.5,0,Math.PI*2);ctx.fill();
    // Tail feathers
    ctx.strokeStyle="#d4c080";ctx.lineWidth=1.2;ctx.lineCap="round";
    [-1,0,1].forEach(i=>{ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(-9+i,-2-i);ctx.stroke();});
    // Legs (animated)
    const la=Math.sin(wt)*.4;
    ctx.strokeStyle="#e8a030";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-1,6);ctx.lineTo(-1+la*3,11);ctx.stroke();
    ctx.beginPath();ctx.moveTo(1,6);ctx.lineTo(1-la*3,11);ctx.stroke();
    // Feet
    ctx.strokeStyle="#e8a030";ctx.lineWidth=1;
    [[-1+la*3,11],[1-la*3,11]].forEach(([fx,fy])=>{
      ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx-2,fy+1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx+2,fy+1);ctx.stroke();
    });
    // Head
    const hg=ctx.createRadialGradient(-.5,-8.5,0,0,-8,4);hg.addColorStop(0,"#fffde8");hg.addColorStop(1,"#e8d4a8");
    ctx.fillStyle=hg;ctx.beginPath();ctx.arc(0,-8,4,0,Math.PI*2);ctx.fill();
    // Comb
    ctx.fillStyle="#e03020";
    [0,2,-2].forEach(i=>{ctx.beginPath();ctx.arc(i,-13,1.5,0,Math.PI*2);ctx.fill();});
    ctx.beginPath();ctx.moveTo(-2,-12);ctx.lineTo(2,-12);ctx.lineTo(2,-11);ctx.lineTo(-2,-11);ctx.fill();
    // Beak
    ctx.fillStyle="#e8a020";ctx.beginPath();ctx.moveTo(4,-8);ctx.lineTo(7,-7);ctx.lineTo(4,-6);ctx.closePath();ctx.fill();
    // Eye
    ctx.fillStyle="#1a1a00";ctx.beginPath();ctx.arc(2.5,-8.5,1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="white";ctx.beginPath();ctx.arc(2.8,-8.8,.4,0,Math.PI*2);ctx.fill();
    // Wattle
    ctx.fillStyle="#d02010";ctx.beginPath();ctx.ellipse(3,-6,1.5,2,-.3,0,Math.PI*2);ctx.fill();

  } else if(a.type==="pig"){
    ctx.fillStyle="rgba(0,0,0,.15)";ctx.beginPath();ctx.ellipse(0,12,8,3,0,0,Math.PI*2);ctx.fill();
    // Body
    const pg=ctx.createRadialGradient(-2,-1,0,0,0,11);pg.addColorStop(0,"#ffd0d0");pg.addColorStop(.6,"#f0a0a0");pg.addColorStop(1,"#c07070");
    ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(0,3,10,8,.1,0,Math.PI*2);ctx.fill();
    // Belly
    ctx.fillStyle="#ffc0c0";ctx.beginPath();ctx.ellipse(0,5,6,5,0,0,Math.PI*2);ctx.fill();
    // Tail (curly)
    ctx.strokeStyle="#e09090";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-9,0);for(let t=0;t<Math.PI*1.5;t+=.1){ctx.lineTo(-9-Math.sin(t)*3,-Math.cos(t)*3);}ctx.stroke();
    // Legs
    const la=Math.sin(wt)*.3;
    ctx.fillStyle="#d08080";
    [[-5,10,la],[-2,11,-la],[2,10,la],[5,11,-la]].forEach(([lx,ly,tilt])=>{
      ctx.save();ctx.translate(lx,ly);ctx.rotate(tilt);
      ctx.beginPath();ctx.roundRect(-1.5,0,3,6,1);ctx.fill();ctx.restore();
    });
    // Head
    const hpg=ctx.createRadialGradient(-1,-9,0,0,-9,7);hpg.addColorStop(0,"#ffd8d8");hpg.addColorStop(1,"#e8a0a0");
    ctx.fillStyle=hpg;ctx.beginPath();ctx.ellipse(0,-9,7,6,0,0,Math.PI*2);ctx.fill();
    // Snout
    const sg=ctx.createRadialGradient(0,-6,0,0,-6,4);sg.addColorStop(0,"#ffb0b0");sg.addColorStop(1,"#e09090");
    ctx.fillStyle=sg;ctx.beginPath();ctx.ellipse(0,-6,4,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#c06060";ctx.beginPath();ctx.arc(-1.5,-6.5,1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(1.5,-6.5,1,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle="#2a1a1a";ctx.beginPath();ctx.arc(-2.5,-10,1.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(2.5,-10,1.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="white";ctx.beginPath();ctx.arc(-2.2,-10.3,.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(2.8,-10.3,.5,0,Math.PI*2);ctx.fill();
    // Ears
    ctx.fillStyle="#e09898";
    ctx.beginPath();ctx.moveTo(-5,-13);ctx.lineTo(-8,-17);ctx.lineTo(-2,-13);ctx.fill();
    ctx.beginPath();ctx.moveTo(5,-13);ctx.lineTo(8,-17);ctx.lineTo(2,-13);ctx.fill();

  } else if(a.type==="cow"){
    ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(0,15,12,4,0,0,Math.PI*2);ctx.fill();
    // Body (patchy)
    ctx.fillStyle="#f0ece0";ctx.beginPath();ctx.ellipse(0,3,13,9,.05,0,Math.PI*2);ctx.fill();
    // Spots
    [{x:-5,y:-1,rx:4,ry:3},{x:4,y:4,rx:5,ry:3},{x:-4,y:6,rx:3,ry:2}].forEach(s=>{
      ctx.fillStyle="#3a2a2a";ctx.beginPath();ctx.ellipse(s.x,s.y,s.rx,s.ry,Math.random()*.3,0,Math.PI*2);ctx.fill();
    });
    // Udder
    ctx.fillStyle="#f0c0c0";ctx.beginPath();ctx.ellipse(2,11,4,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#e090a0";[[-1,14],[1,14],[3,14],[5,14]].forEach(([nx,ny])=>{ctx.beginPath();ctx.arc(nx,ny,1,0,Math.PI*2);ctx.fill();});
    // Legs
    const la=Math.sin(wt)*.25;
    ctx.fillStyle="#f0ece0";
    [[-7,12,la],[-3,13,-la],[3,12,la],[7,13,-la]].forEach(([lx,ly,tilt])=>{
      ctx.save();ctx.translate(lx,ly);ctx.rotate(tilt);
      ctx.beginPath();ctx.roundRect(-2,0,4,10,1);ctx.fill();
      ctx.fillStyle="#3a2a2a";ctx.beginPath();ctx.roundRect(-2,9,4,3,1);ctx.fill();
      ctx.restore();ctx.fillStyle="#f0ece0";
    });
    // Tail
    ctx.strokeStyle="#c0b898";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-12,0);ctx.quadraticCurveTo(-16,-4,-14,4);ctx.stroke();
    ctx.fillStyle="#8a7860";ctx.beginPath();ctx.arc(-14,4,2.5,0,Math.PI*2);ctx.fill();
    // Head
    ctx.fillStyle="#f0ece0";ctx.beginPath();ctx.ellipse(0,-11,7,6,0,0,Math.PI*2);ctx.fill();
    // Muzzle
    ctx.fillStyle="#e0c8b0";ctx.beginPath();ctx.ellipse(0,-8,5,3.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#8a6850";ctx.beginPath();ctx.arc(-2,-8,1.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(2,-8,1.2,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle="#2a1810";ctx.beginPath();ctx.arc(-3.5,-12,1.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(3.5,-12,1.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="white";ctx.beginPath();ctx.arc(-3,-12.5,.6,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(4,-12.5,.6,0,Math.PI*2);ctx.fill();
    // Horns
    ctx.strokeStyle="#d4b870";ctx.lineWidth=2;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(-4,-16);ctx.quadraticCurveTo(-7,-21,-5,-22);ctx.stroke();
    ctx.beginPath();ctx.moveTo(4,-16);ctx.quadraticCurveTo(7,-21,5,-22);ctx.stroke();
    // Ears
    ctx.fillStyle="#e0b8a0";ctx.beginPath();ctx.ellipse(-7,-14,3,2,.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(7,-14,3,2,-.5,0,Math.PI*2);ctx.fill();

  } else if(a.type==="duck"){
    ctx.fillStyle="rgba(0,0,0,.12)";ctx.beginPath();ctx.ellipse(0,8,5.5,2,0,0,Math.PI*2);ctx.fill();
    // Body
    const dg=ctx.createRadialGradient(-1,0,0,0,0,7);dg.addColorStop(0,"#fffef0");dg.addColorStop(.7,"#f0e8d0");dg.addColorStop(1,"#d8cfa8");
    ctx.fillStyle=dg;ctx.beginPath();ctx.ellipse(0,2,7,5,.15,0,Math.PI*2);ctx.fill();
    // Wing detail
    ctx.strokeStyle="#d8cfa8";ctx.lineWidth=.8;
    ctx.beginPath();ctx.arc(0,2,5,Math.PI*.7,Math.PI*1.5);ctx.stroke();
    // Tail
    ctx.fillStyle="#e8e0b8";ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-10,-3);ctx.lineTo(-8,2);ctx.closePath();ctx.fill();
    // Legs
    const la=Math.sin(wt)*.35;
    ctx.strokeStyle="#e8a020";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-1,6);ctx.lineTo(-1+la*2,10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(1,6);ctx.lineTo(1-la*2,10);ctx.stroke();
    // Webbed feet
    ctx.fillStyle="#e8a020";ctx.beginPath();ctx.ellipse(-1+la*2,11,3,1.5,.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(1-la*2,11,3,1.5,-.2,0,Math.PI*2);ctx.fill();
    // Head (male mallard green)
    const hd=ctx.createRadialGradient(-.5,-8.5,0,0,-8,4);hd.addColorStop(0,"#50cc80");hd.addColorStop(.5,"#20a050");hd.addColorStop(1,"#106030");
    ctx.fillStyle=hd;ctx.beginPath();ctx.arc(0,-8,4,0,Math.PI*2);ctx.fill();
    // White collar
    ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,-5,3.5,-.4,Math.PI+.4);ctx.stroke();
    // Bill
    ctx.fillStyle="#f0c820";ctx.beginPath();ctx.moveTo(4,-8);ctx.lineTo(8,-7.5);ctx.lineTo(8,-6.5);ctx.lineTo(4,-7);ctx.closePath();ctx.fill();
    // Eye
    ctx.fillStyle="#1a1a00";ctx.beginPath();ctx.arc(2.5,-9,1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="white";ctx.beginPath();ctx.arc(2.8,-9.3,.4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ── Farmer drawing ────────────────────────────────────
const TOOL_COLORS={plow:"#8B5E3C",rice:"#78a828",corn:"#e8c820",tomato:"#50c050",melon:"#30a830",tree:"#228822",water:"#1565A8",harvest:"#c49020"};
function drawFarmerISO(c2d,sx,sy){
  const f=farmer;
  const wt=f.walkT;
  const bob=f.moving?Math.abs(Math.sin(wt))*2.5:0;
  const legA=f.moving?Math.sin(wt)*.45:0;
  const dir=f.facingRight?1:-1;
  const tc=TOOL_COLORS[f.currentTool]||"#8B5E3C";
  c2d.save();c2d.translate(Math.round(sx),Math.round(sy-bob));c2d.scale(dir,1);
  // Shadow
  c2d.fillStyle="rgba(0,0,0,.2)";c2d.beginPath();c2d.ellipse(0,8+bob,8,2.5,0,0,Math.PI*2);c2d.fill();
  // Back leg
  c2d.strokeStyle=darken(C.pants,10);c2d.lineWidth=4;c2d.lineCap="round";
  const blx=Math.sin(legA)*8,bly=Math.cos(legA)*8;
  c2d.beginPath();c2d.moveTo(-2,4);c2d.lineTo(-2+blx*.6,4+bly);c2d.stroke();
  c2d.fillStyle="#1a1000";c2d.beginPath();c2d.ellipse(-2+blx*.6,4+bly,3.5,1.5,.2,0,Math.PI*2);c2d.fill();
  // Front leg
  c2d.strokeStyle=C.pants;c2d.lineWidth=4;
  const flx=Math.sin(-legA)*8,fly=Math.cos(-legA)*8;
  c2d.beginPath();c2d.moveTo(2,4);c2d.lineTo(2+flx*.6,4+fly);c2d.stroke();
  c2d.fillStyle="#1a1000";c2d.beginPath();c2d.ellipse(2+flx*.6,4+fly,3.5,1.5,.2,0,Math.PI*2);c2d.fill();
  // Body
  const bodyG=c2d.createRadialGradient(-2,-3,0,0,-1,8);bodyG.addColorStop(0,lighten(C.shirt,25));bodyG.addColorStop(.7,C.shirt);bodyG.addColorStop(1,darken(C.shirt,25));
  c2d.fillStyle=bodyG;c2d.beginPath();c2d.roundRect(-5,-8,11,13,3);c2d.fill();
  // Shirt details
  c2d.fillStyle="rgba(0,0,0,.08)";c2d.beginPath();c2d.roundRect(1,-7,4,12,3);c2d.fill();
  // Back arm + tool
  const armSwing=f.moving?-Math.sin(wt)*.4:(f.working?Math.sin(f.workT*.22)*.9:0);
  const bArmY=Math.sin(armSwing)*9;
  c2d.strokeStyle=darken(C.shirt,15);c2d.lineWidth=3.5;
  c2d.beginPath();c2d.moveTo(4,-3);c2d.lineTo(12,-3+bArmY);c2d.stroke();
  c2d.fillStyle=C.skin;c2d.beginPath();c2d.arc(12,-3+bArmY,2.5,0,Math.PI*2);c2d.fill();
  // Tool
  c2d.save();c2d.translate(12,-3+bArmY);
  const tilt=f.working?Math.sin(f.workT*.25)*.7:.2;c2d.rotate(tilt);
  if(f.currentTool==="water"){
    c2d.fillStyle="#2a70c0";c2d.beginPath();c2d.roundRect(-1,-5,10,6,2);c2d.fill();
    c2d.strokeStyle="#1a50a0";c2d.lineWidth=1.5;c2d.beginPath();c2d.moveTo(9,-2);c2d.lineTo(14,2);c2d.stroke();
  } else {
    c2d.strokeStyle="#8B6230";c2d.lineWidth=1.8;c2d.beginPath();c2d.moveTo(0,0);c2d.lineTo(3,-14);c2d.stroke();
    c2d.fillStyle=tc;c2d.beginPath();c2d.moveTo(0,0);c2d.lineTo(6,3);c2d.lineTo(5,-3);c2d.closePath();c2d.fill();
  }
  c2d.restore();
  // Neck
  c2d.fillStyle=C.skin;c2d.beginPath();c2d.roundRect(-2,-15,4,6,1);c2d.fill();
  // Head
  const headG=c2d.createRadialGradient(-1,-20,0,0,-19,6);headG.addColorStop(0,lighten(C.skin,20));headG.addColorStop(1,darken(C.skin,10));
  c2d.fillStyle=headG;c2d.beginPath();c2d.ellipse(0,-19,6,7,0,0,Math.PI*2);c2d.fill();
  c2d.fillStyle="rgba(0,0,0,.06)";c2d.beginPath();c2d.ellipse(3,-19,3,5,0,0,Math.PI*2);c2d.fill();
  // Ear
  c2d.fillStyle=lighten(C.skin,8);c2d.beginPath();c2d.ellipse(-5,-19,2,3,.1,0,Math.PI*2);c2d.fill();
  // Hat brim
  const hatG=c2d.createLinearGradient(-9,-25,9,-25);hatG.addColorStop(0,darken(C.hat,10));hatG.addColorStop(.5,lighten(C.hat,15));hatG.addColorStop(1,darken(C.hat,10));
  c2d.fillStyle=hatG;c2d.beginPath();c2d.ellipse(0,-24,9.5,3.5,0,0,Math.PI*2);c2d.fill();
  c2d.fillStyle=C.hat;c2d.beginPath();c2d.roundRect(-5,-33,10,10,2);c2d.fill();
  c2d.fillStyle=lighten(C.hat,25);c2d.beginPath();c2d.rect(-5,-25,10,2.5);c2d.fill();
  // Eye & smile
  c2d.fillStyle="#1a0800";c2d.beginPath();c2d.ellipse(2.5,-19,1.5,1.8,0,0,Math.PI*2);c2d.fill();
  c2d.fillStyle="rgba(255,255,255,.7)";c2d.beginPath();c2d.arc(3,-19.5,.6,0,Math.PI*2);c2d.fill();
  c2d.strokeStyle="#7a4000";c2d.lineWidth=1;
  if(f.working){c2d.beginPath();c2d.moveTo(.5,-15.5);c2d.lineTo(3.5,-15.5);c2d.stroke();}
  else{c2d.beginPath();c2d.arc(1.5,-16,2,.2,Math.PI-.2);c2d.stroke();}
  // Front arm
  const fArmY=Math.sin(-armSwing)*9;
  c2d.strokeStyle=C.shirt;c2d.lineWidth=3;
  c2d.beginPath();c2d.moveTo(-4,-3);c2d.lineTo(-10,-3+fArmY);c2d.stroke();
  c2d.fillStyle=C.skin;c2d.beginPath();c2d.arc(-10,-3+fArmY,2,0,Math.PI*2);c2d.fill();
  c2d.restore();
}

// ── Particle system ────────────────────────────────────
function spawnParticles(sx,sy,color,count){
  for(let i=0;i<count;i++){
    particles.push({x:sx,y:sy,vx:(Math.random()-.5)*4,vy:-(Math.random()*3+1),life:1,color,size:Math.random()*3+1});
  }
}
function updateParticles(){particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.03;return p.life>0;});}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

// ── Top color for tile ─────────────────────────────────
function topColor(cell){
  if(cell.state===STATE.EMPTY)return C.empty;
  if(cell.state===STATE.PLOWED)return C.plowed;
  if(cell.state===STATE.WATERED){
    const rp=(Math.sin(windT*.06+cell._seed||0)+1)*.5;
    return lerpColor(C.watered,lighten(C.watered,15),rp);
  }
  if(cell.state===STATE.PLANTED||cell.state===STATE.GROWING||cell.state===STATE.READY)return darken(C.plowed,10);
  return C.empty;
}

// ── Hover ─────────────────────────────────────────────
let hoverCell=null;
canvas.addEventListener("mousemove",e=>{
  const rect=canvas.getBoundingClientRect();
  hoverCell=uniso(e.clientX-rect.left,e.clientY-rect.top);
});
canvas.addEventListener("mouseleave",()=>hoverCell=null);

// ── Draw pen floor tile (no fences here) ──────────────
function drawPenTile(sx, sy, c, r) {
  const hw = TW/2, hh = TH/2, d = DEPTH;

  // Left iso face
  ctx.beginPath();
  ctx.moveTo(sx-hw,sy); ctx.lineTo(sx,sy+hh);
  ctx.lineTo(sx,sy+hh+d); ctx.lineTo(sx-hw,sy+d);
  ctx.closePath();
  ctx.fillStyle="#8a6030"; ctx.fill();

  // Right iso face
  ctx.beginPath();
  ctx.moveTo(sx+hw,sy); ctx.lineTo(sx,sy+hh);
  ctx.lineTo(sx,sy+hh+d); ctx.lineTo(sx+hw,sy+d);
  ctx.closePath();
  ctx.fillStyle="#a07840"; ctx.fill();

  // Top face
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy);
  ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy);
  ctx.closePath();
  ctx.fillStyle="#c8a060"; ctx.fill();

  // Hay stripes (own save/restore)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy);
  ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle="rgba(160,120,40,.35)"; ctx.lineWidth=1;
  for(let i=-3;i<=6;i++){
    ctx.beginPath();
    ctx.moveTo(sx-hw+i*7,sy-hh);
    ctx.lineTo(sx-hw+i*7-9,sy+hh);
    ctx.stroke();
  }
  ctx.restore();

  // Border
  ctx.beginPath();
  ctx.moveTo(sx,sy-hh); ctx.lineTo(sx+hw,sy);
  ctx.lineTo(sx,sy+hh); ctx.lineTo(sx-hw,sy);
  ctx.closePath();
  ctx.strokeStyle="rgba(0,0,0,.12)"; ctx.lineWidth=0.5; ctx.stroke();
}

// ── Draw pen outer fence (whole pen perimeter, called once per pen id) ──
const drawnPenFences = new Set();
function drawPenFence(penId) {
  // Collect all cells of this pen
  const cells = pens.filter(p => p.id === penId);
  if (!cells.length) return;

  // Get bounding box (assumes rectangular 2x2)
  const minC = Math.min(...cells.map(p=>p.c));
  const minR = Math.min(...cells.map(p=>p.r));
  const maxC = Math.max(...cells.map(p=>p.c)) + 1; // exclusive
  const maxR = Math.max(...cells.map(p=>p.r)) + 1; // exclusive

  // The 4 outer CORNERS of the bounding box in iso screen coords:
  // In iso: tile(c,r) top corner = iso(c, r) - hh
  //   Top    corner of bounding box = iso point of (minC, minR) top
  //   Right  corner                 = iso point of (maxC, minR) right = iso of (maxC-1,minR) + hw
  //   Bottom corner                 = iso point of (maxC-1, maxR-1) bottom
  //   Left   corner                 = iso point of (minC, maxR-1) left
  //
  // Simpler: use the iso projection of the 4 extreme grid corners:
  //   Top    = project(minC,   minR  ) → top    of that tile = sy-hh
  //   Right  = project(maxC-1, minR  ) → right  of that tile = sx+hw, sy
  //   Bottom = project(maxC-1, maxR-1) → bottom of that tile = sx,    sy+hh  
  //   Left   = project(minC,   maxR-1) → left   of that tile = sx-hw, sy

  function pt(c,r,corner){
    const {sx,sy}=iso(c,r);
    const hw=TW/2,hh=TH/2;
    if(corner==='top')    return {x:sx,      y:sy-hh};
    if(corner==='right')  return {x:sx+hw,   y:sy};
    if(corner==='bottom') return {x:sx,      y:sy+hh};
    if(corner==='left')   return {x:sx-hw,   y:sy};
  }

  // The 4 corners of the whole pen outline:
  const TOP    = pt(minC,   minR,   'top');
  const RIGHT  = pt(maxC-1, minR,   'right');
  const BOTTOM = pt(maxC-1, maxR-1, 'bottom');
  const LEFT   = pt(minC,   maxR-1, 'left');

  const POST_H=22, RAIL_H=[11,5];
  const COL_DARK="#6B3500", COL_MID="#8B5020", COL_LIGHT="#B07040", COL_POST="#3a1a04";

  // Draw a fence segment from p1 to p2 with posts at ends + midpoint
  function fenceSeg(p1, p2) {
    const mid={x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};

    // Rails behind posts
    RAIL_H.forEach(rh=>{
      ctx.strokeStyle=COL_DARK; ctx.lineWidth=3; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y-rh); ctx.lineTo(p2.x,p2.y-rh); ctx.stroke();
      ctx.strokeStyle=COL_LIGHT; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y-rh-1); ctx.lineTo(p2.x,p2.y-rh-1); ctx.stroke();
    });

    // Posts: start, mid, end
    [p1, mid, p2].forEach(p=>{
      ctx.fillStyle=COL_POST;
      ctx.fillRect(p.x-2.5, p.y-POST_H, 5, POST_H+3);
      ctx.fillStyle=COL_MID;
      ctx.fillRect(p.x-2,   p.y-POST_H, 4, POST_H+1);
      // Highlight
      ctx.fillStyle=COL_LIGHT;
      ctx.fillRect(p.x-2.5, p.y-POST_H-2.5, 5, 3);
    });
  }

  // 4 sides of the rectangular pen
  fenceSeg(TOP,   RIGHT);   // NE side
  fenceSeg(RIGHT, BOTTOM);  // SE side
  fenceSeg(BOTTOM, LEFT);   // SW side
  fenceSeg(LEFT,  TOP);     // NW side
}

// ── Draw ──────────────────────────────────────────────
let pvT=0;

function draw(){
  updateParticles();
  // Background
  if(bgImg.complete&&bgImg.naturalWidth){
    ctx.drawImage(bgImg,0,0,W,H);
    ctx.fillStyle="rgba(0,0,0,.16)";ctx.fillRect(0,0,W,H);
  } else {
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#e8b870");g.addColorStop(.5,"#f5d4a0");g.addColorStop(1,"#2d4a1e");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  // Build draw list
  const farmerDepth=farmer.gc+farmer.gr;
  const list=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) list.push({d:r+c,type:"tile",r,c});
  pens.forEach(p=>list.push({d:p.c+p.r+.1,type:"pen",c:p.c,r:p.r}));
  animals.forEach((a,i)=>list.push({d:a.gx+a.gy+.45,type:"animal",i}));
  list.push({d:farmerDepth+.5,type:"farmer"});
  list.sort((a,b)=>a.d-b.d);

  for(const item of list){
    if(item.type==="pen"){
      const{sx,sy}=iso(item.c,item.r);
      drawPenTile(sx,sy,item.c,item.r);
    } else if(item.type==="farmer"){
      const{sx,sy}=iso(farmer.gc,farmer.gr);
      drawFarmerISO(ctx,sx,sy-DEPTH);
      if(farmer.moving){
        const{sx:tx,sy:ty}=iso(farmer.tc-.5,farmer.tr-.5);
        const hw=TW/2,hh=TH/2,pulse=.5+Math.sin(windT*.2)*.5;
        ctx.strokeStyle=`rgba(255,220,50,${pulse})`;ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(tx,ty-hh);ctx.lineTo(tx+hw,ty);ctx.lineTo(tx,ty+hh);ctx.lineTo(tx-hw,ty);ctx.closePath();ctx.stroke();ctx.setLineDash([]);
      }
    } else if(item.type==="animal"){
      drawAnimal(animals[item.i]);
    } else {
      const{r,c}=item,cell=grid[r][c];
      const{sx,sy}=iso(c,r);
      const isHov=hoverCell&&hoverCell.c===c&&hoverCell.r===r;
      const top=isHov?lighten(topColor(cell),18):topColor(cell);
      drawTile(sx,sy,top);
      if(isHov)drawTileGlow(sx,sy);
      drawPlant(sx,sy,cell,c*7.1+r*3.3);
    }
  }
  drawParticles();
  // Draw pen fences on top of everything (once per pen)
  const seenPenIds = new Set();
  pens.forEach(p=>{
    if(!seenPenIds.has(p.id)){seenPenIds.add(p.id);drawPenFence(p.id);}
  });
}

// ── Animal AI ─────────────────────────────────────────
function penBounds(penId){
  // Get the bounding box of all cells belonging to this pen
  const cells=pens.filter(p=>p.id===penId);
  if(!cells.length)return null;
  const cs=cells.map(p=>p.c),rs=cells.map(p=>p.r);
  return{minC:Math.min(...cs),maxC:Math.max(...cs)+1,minR:Math.min(...rs),maxR:Math.max(...rs)+1};
}
function updateAnimals(){
  animals.forEach(a=>{
    a.timer=(a.timer||0)-1;
    if(a.timer<=0){
      let minC=.3,maxC=COLS-.7,minR=.3,maxR=ROWS-.7;
      if(a.penId!=null){
        const b=penBounds(a.penId);
        if(b){
          minC=b.minC+.4; maxC=b.maxC-.4;
          minR=b.minR+.4; maxR=b.maxR-.4;
        }
      }
      const dc=(Math.random()-.5)*.6,dr=(Math.random()-.5)*.6;
      // clamp BEFORE assignment so they never escape
      a.gx=Math.max(minC,Math.min(maxC,a.gx+dc));
      a.gy=Math.max(minR,Math.min(maxR,a.gy+dr));
      a.dir=dc<0?-1:1;
      a.timer=40+Math.floor(Math.random()*60);
    }
    // Hard-clamp every frame
    if(a.penId!=null){
      const b=penBounds(a.penId);
      if(b){
        a.gx=Math.max(b.minC+.4,Math.min(b.maxC-.4,a.gx));
        a.gy=Math.max(b.minR+.4,Math.min(b.maxR-.4,a.gy));
      }
    }
    a.walkT+=.15;
  });
}

// ── Game logic ─────────────────────────────────────────
function setTool(t){
  tool=t;farmer.currentTool=t;
  document.querySelectorAll(".tool-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("t-"+t).classList.add("active");
}

let penIdCounter=0;
function doAction(r,c){
  const cell=grid[r][c];
  const{sx,sy}=iso(c,r);
  // --- Place pen (2x2 block) ---
  if(tool==="pen"){
    const existing=pens.find(p=>p.c===c&&p.r===r);
    if(!existing){
      if(money<200){setMsg("💸 เงินไม่พอสร้างคอก 2x2 (200฿)");return;}
      // Check all 4 cells free
      const cells=[[c,r],[c+1,r],[c,r+1],[c+1,r+1]];
      if(cells.some(([cc,rr])=>cc>=COLS||rr>=ROWS||pens.some(p=>p.c===cc&&p.r===rr))){
        setMsg("⚠️ ไม่มีพื้นที่พอสำหรับคอก 2x2");return;
      }
      money-=200;
      const id=penIdCounter++;
      cells.forEach(([cc,rr])=>pens.push({c:cc,r:rr,id}));
      spawnParticles(sx,sy-DEPTH,"#c8a040",10);
      setMsg("🏠 สร้างคอก 2x2 แล้ว! เลือกสัตว์แล้วคลิกคอก");
    } else {
      // Click on existing pen — try to place animal
      if(animalToBuy){buyAnimalIntoPen(existing.id,c,r);}
      else setMsg("🐾 เลือกสัตว์ด้านล่างก่อน แล้วคลิกคอก");
    }
    updateHUD();draw();return;
  }
  // --- Remove pen (removes entire 2x2 block) ---
  if(tool==="remove"){
    const hit=pens.find(p=>p.c===c&&p.r===r);
    if(hit){
      const pid=hit.id;
      pens=pens.filter(p=>p.id!==pid);
      animals.forEach(a=>{if(a.penId===pid)a.penId=null;});
      setMsg("🗑 รื้อคอกแล้ว");draw();
    }
    return;
  }
  // --- Normal click on pen tile: place animal ---
  const penOnTile=pens.find(p=>p.c===c&&p.r===r);
  if(penOnTile&&animalToBuy){buyAnimalIntoPen(penOnTile.id,c,r);return;}
  if(tool==="plow"){
    if(cell.state===STATE.EMPTY){
      if(money<10){setMsg("💸 เงินไม่พอไถนา (ต้องการ 10฿)");return;}
      money-=10;cell.state=STATE.PLOWED;cell._seed=c*7.1+r*3.3;
      spawnParticles(sx,sy-DEPTH,"#a06030",6);setMsg("✅ ไถนาเสร็จ!");
    } else setMsg("⚠️ แปลงนี้ไม่ว่าง");
  } else if(["rice","corn","tomato","melon","tree"].includes(tool)){
    if(cell.state===STATE.PLOWED){
      const cr=CROPS[tool];
      if(money<cr.cost){setMsg(`💸 เงินไม่พอ (ต้องการ ${cr.cost}฿)`);return;}
      money-=cr.cost;cell.state=STATE.PLANTED;cell.crop=tool;cell.days=0;cell.water=1;cell.growPct=0;
      spawnParticles(sx,sy-DEPTH,"#80cc40",8);setMsg(`🌱 ปลูก${cr.name}แล้ว!`);
    } else setMsg("⚠️ ต้องไถนาก่อนปลูก");
  } else if(tool==="water"){
    if([STATE.PLANTED,STATE.GROWING,STATE.WATERED].includes(cell.state)){
      cell.water=Math.min(3,cell.water+1);cell.state=STATE.WATERED;
      spawnParticles(sx,sy-DEPTH,"#60a8e0",5);setMsg("💧 รดน้ำแล้ว!");
    } else setMsg("⚠️ ไม่มีพืชให้รดน้ำ");
  } else if(tool==="harvest"){
    if(cell.state===STATE.READY){
      const cr=CROPS[cell.crop];
      const got=cr.yield[0]+Math.floor(Math.random()*(cr.yield[1]-cr.yield[0]+1));
      inventory[cr.harvest]+=got;
      const pts=got*10;score+=pts;
      spawnParticles(sx,sy-DEPTH,cr.matureColor,12);
      if(cr.permanent){cell.state=STATE.GROWING;cell.days=0;cell.growPct=1;}
      else{cell.state=STATE.EMPTY;cell.crop=null;cell.days=0;cell.growPct=0;}
      setMsg(`🎉 เก็บได้ ${got} ${cr.name}! (+${pts}⭐)`);
    } else setMsg("⚠️ พืชยังไม่พร้อมเก็บ");
  }
  updateHUD();
}

canvas.addEventListener("click",e=>{
  if(farmer.moving||farmer.working)return;
  const rect=canvas.getBoundingClientRect();
  const hit=uniso(e.clientX-rect.left,e.clientY-rect.top);
  if(!hit)return;
  moveFarmerTo(hit.c,hit.r,()=>doAction(hit.r,hit.c));
});

const ANIMAL_COSTS={chicken:150,pig:300,cow:500,duck:120};
const ANIMAL_NAMES={chicken:"ไก่",pig:"หมู",cow:"วัว",duck:"เป็ด"};
function selectAnimalToBuy(type){
  animalToBuy=type;
  document.querySelectorAll(".animal-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("a-"+type).classList.add("active");
  setMsg(`🏠 คลิกที่คอกเพื่อวาง ${ANIMAL_NAMES[type]}`);
}
function buyAnimalIntoPen(penId,penC,penR){
  if(!animalToBuy)return false;
  const type=animalToBuy;
  const cost=ANIMAL_COSTS[type];
  if(money<cost){setMsg(`💸 เงินไม่พอ (${cost}฿)`);animalToBuy=null;return false;}
  // Max 4 animals per pen (2x2 = 4 cells)
  const inPen=animals.filter(a=>a.penId===penId).length;
  if(inPen>=4){setMsg("⚠️ คอกเต็มแล้ว! (สูงสุด 4 ตัว)");return false;}
  money-=cost;
  const b=penBounds(penId);
  // Safe spawn: centre of pen + small random offset, guaranteed inside
  const cx=b?(b.minC+b.maxC)/2:penC+0.5;
  const cy=b?(b.minR+b.maxR)/2:penR+0.5;
  const hw=b?(b.maxC-b.minC)/2-0.45:0.4;
  const hh=b?(b.maxR-b.minR)/2-0.45:0.4;
  const gx=cx+(Math.random()*2-1)*hw;
  const gy=cy+(Math.random()*2-1)*hh;
  animals.push({type,gx,gy,walkT:Math.random()*10,dir:1,timer:30,penId});
  animalToBuy=null;
  document.querySelectorAll(".animal-btn").forEach(btn=>btn.classList.remove("active"));
  setMsg(`🐾 วาง ${ANIMAL_NAMES[type]} ในคอกแล้ว!`);
  updateHUD();
  if(!animId)animLoop();
  return true;
}

function sellAll(){
  let total=0;
  const prices={rice:80,veg:100,fruit:150};
  for(const k in inventory){total+=inventory[k]*(prices[k]||80);inventory[k]=0;}
  money+=total;
  if(total>0){setMsg(`💰 ขายได้ ${total}฿!`);spawnParticles(W/2,H*.6,"#f0c840",20);}
  else setMsg("📦 ไม่มีสินค้าขาย");
  updateHUD();
}

function nextDay(){
  if(farmer.moving||farmer.working)return;
  day++;
  // Animal produce
  let animalBonus=0;
  animals.forEach(a=>{
    if(a.type==="chicken"){money+=20;animalBonus+=20;}
    else if(a.type==="duck"){money+=15;animalBonus+=15;}
    else if(a.type==="pig"){score+=5;}
    else if(a.type==="cow"){money+=50;animalBonus+=50;}
  });
  // Crop growth
  let readyCount=0;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=grid[r][c];
    if([STATE.PLANTED,STATE.WATERED,STATE.GROWING].includes(cell.state)&&cell.crop){
      const cr=CROPS[cell.crop];
      cell.days++;
      const wb=cell.water>0?1:0;
      const daysNeeded=cr.days-wb;
      cell.growPct=Math.min(1,cell.days/daysNeeded);
      if(cell.days>=daysNeeded){cell.state=STATE.READY;cell.growPct=1;readyCount++;}
      else cell.state=cell.water>0?STATE.WATERED:STATE.GROWING;
      cell.water=Math.max(0,cell.water-1);
    }
  }
  // Animals wander
  updateAnimals();
  if(day%5===0){season=Math.min(TOTAL_SEASONS,Math.ceil(day/5));}
  let msg=`☀️ วันที่ ${day}`;
  if(readyCount>0)msg+=` - พืช ${readyCount} แปลงพร้อมเก็บ!`;
  if(animalBonus>0)msg+=` - สัตว์ให้ +${animalBonus}฿`;
  setMsg(msg);
  updateHUD();
  windT++;
  draw();
}

// ── HUD ───────────────────────────────────────────────
function setMsg(t){document.getElementById("msg").textContent=t;}
function updateHUD(){
  document.getElementById("h-money").textContent=money;
  document.getElementById("h-day").textContent=day;
  document.getElementById("h-rice").textContent=inventory.rice;
  document.getElementById("h-veg").textContent=inventory.veg;
  document.getElementById("h-fruit").textContent=inventory.fruit;
  document.getElementById("h-score").textContent=score;
  const bar=document.getElementById("season-bar");bar.innerHTML="";
  for(let i=0;i<TOTAL_SEASONS;i++){
    const d=document.createElement("div");
    d.className="season-dot"+(i<season-1?" done":i===season-1?" current":"");
    bar.appendChild(d);
  }
}

// ── Preview ───────────────────────────────────────────
const pvc=document.getElementById("preview");const pvx=pvc.getContext("2d");
setInterval(()=>{
  pvT+=.2;pvx.clearRect(0,0,80,80);
  pvx.fillStyle="#1a3010";pvx.fillRect(0,0,80,80);
  const sx=40,sy=52,hw=20,hh=10,d=6;
  pvx.fillStyle=darken(C.plowed,40);pvx.beginPath();pvx.moveTo(sx-hw,sy);pvx.lineTo(sx,sy+hh);pvx.lineTo(sx,sy+hh+d);pvx.lineTo(sx-hw,sy+d);pvx.closePath();pvx.fill();
  pvx.fillStyle=darken(C.plowed,20);pvx.beginPath();pvx.moveTo(sx+hw,sy);pvx.lineTo(sx,sy+hh);pvx.lineTo(sx,sy+hh+d);pvx.lineTo(sx+hw,sy+d);pvx.closePath();pvx.fill();
  pvx.fillStyle=C.plowed;pvx.beginPath();pvx.moveTo(sx,sy-hh);pvx.lineTo(sx+hw,sy);pvx.lineTo(sx,sy+hh);pvx.lineTo(sx-hw,sy);pvx.closePath();pvx.fill();
  const saved={...farmer};farmer.gc=.5;farmer.gr=.5;farmer.walkT=pvT;farmer.moving=true;farmer.working=false;
  drawFarmerISO(pvx,sx,sy-d);Object.assign(farmer,saved);
},50);

// ── Idle loop ──────────────────────────────────────────
function idleLoop(){
  windT++;
  let needRedraw=particles.length>0||farmer.moving||farmer.working;
  if(!needRedraw&&animals.length)needRedraw=true;
  if(!needRedraw){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c].state>=STATE.PLANTED){needRedraw=true;break;}}
  if(needRedraw&&!animId){updateParticles();draw();}
  requestAnimationFrame(idleLoop);
}

updateHUD();draw();idleLoop();
</script>
